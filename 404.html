<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — austin-code.com</title>
  <script>
    // Static hosting serves this page for any unknown path with the URL intact,
    // which is the only hook available for /s/<version>/<code> shortlinks. Send
    // those straight to the lab at /s/, naming the version so its codec is
    // tried first. A code can hold '?' (Base81) but never '/' or '#', so the
    // query tail belongs to the code and goes inside the fragment.
    (function () {
      var m = location.pathname.match(/^\/s\/(\d+)\/(.+)$/);
      if (m && (m[1] === '1' || m[1] === '2' || m[1] === '3')) {
        location.replace('/s/?v=' + m[1] + '#' + m[2] + location.search);
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050a13;
      --panel: #0a111e;
      --panel-2: #101827;
      --line: #283447;
      --text: #f4f7fb;
      --muted: #91a0b6;
      --green: #a9ff32;
      --body-glow: rgba(18, 45, 77, .22);
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #eef2f8;
        --panel: #ffffff;
        --panel-2: #f5f8fd;
        --line: #d2dbea;
        --text: #0c1420;
        --muted: #55647a;
        --green: #3f8a00;
        --body-glow: rgba(120, 170, 255, .28);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 22px;
      background:
        radial-gradient(1100px 620px at 50% -12%, var(--body-glow), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { width: min(560px, 100%); }

    .code {
      font: 900 clamp(56px, 12vw, 96px) / 1 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: -.06em;
      color: var(--green);
      margin: 0;
    }

    h1 {
      margin: 6px 0 10px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    p { margin: 0 0 26px; color: var(--muted); }

    .links { display: flex; flex-wrap: wrap; gap: 10px; }

    .links a {
      padding: 9px 15px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: linear-gradient(160deg, var(--panel-2), var(--panel));
      color: inherit;
      text-decoration: none;
      font-size: 14.5px;
      transition: border-color .16s ease;
    }

    .links a:hover,
    .links a:focus-visible { border-color: var(--green); outline: none; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="code">404</p>
    <h1>Nothing at this address</h1>
    <p>If you followed a shortlink, its version segment has to be 1, 2 or 3 — anything else lands here.</p>
    <div class="links">
      <a href="/">Launcher</a>
      <a href="/miniplay/">Mini Play</a>
      <a href="/s/">Shortlink</a>
    </div>
  </main>
</body>
</html>
