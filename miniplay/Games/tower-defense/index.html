  ctx.beginPath(); ctx.arc(w*0.1,-h*0.48,2.5,0,Math.PI*2); ctx.fill();
}

// ─── TOWER DRAWING ────────────────────────────────────────────────────────────
function drawTowers(){
  towers.forEach(t=>{
    const sel=t===selectedPlacedTower;
    if(sel){
      ctx.save();
      ctx.globalCompositeOperation="lighter";
      ctx.strokeStyle="rgba(100,180,255,0.3)"; ctx.lineWidth=1.5; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.arc(t.x,t.y,t.range,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }
    const sx=(Math.random()-0.5)*t.shake, sy=(Math.random()-0.5)*t.shake;
    ctx.save(); ctx.translate(sx,sy);
    ctx.translate(t.x,t.y); ctx.scale(TSCALE,TSCALE); ctx.translate(-t.x,-t.y);
    if(t.type==="rapid") drawRapidTower(t);
    else if(t.type==="heavy") drawHeavyTower(t);
    else if(t.type==="laser") drawLaserTower(t);
    else if(t.type==="mortar") drawMortarTower(t);
    else if(t.type==="tesla") drawTeslaTower(t);
    else if(t.type==="cryo") drawCryoTower(t);
    else if(t.type==="sniper") drawSniperTower(t);
    drawTowerRank(t);
    ctx.restore();
  });
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.fill();
}

function drawRapidTower(t){
  ctx.fillStyle="#1e2a38";
  ctx.beginPath(); ctx.arc(t.x,t.y,26,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#4a6278"; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(t.x,t.y,20,0,Math.PI*2); ctx.stroke();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    ctx.fillStyle="#5a7898";
    ctx.beginPath(); ctx.arc(t.x+Math.cos(a)*18,t.y+Math.sin(a)*18,2,0,Math.PI*2); ctx.fill();
  }
  ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.angle);
  ctx.fillStyle="#263545"; rr(-22,-16,36,32,5);
  ctx.fillStyle="#3d5568"; rr(-8,-20,26,8,2); rr(-8,12,26,8,2);
  ctx.fillStyle="#6a8fa8"; rr(8,-12,40-t.recoil,24,5);
  ctx.fillStyle="#aac0d0"; ctx.fillRect(16,-8,16,3);
  ctx.fillStyle="#1a2430"; ctx.beginPath(); ctx.arc(47-t.recoil,0,5,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawHeavyTower(t){
  ctx.fillStyle="#1c1f24";
  ctx.beginPath(); ctx.arc(t.x,t.y,38,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#3f4550"; ctx.lineWidth=6;
  ctx.beginPath(); ctx.arc(t.x,t.y,30,0,Math.PI*2); ctx.stroke();
  ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.angle);
  ctx.fillStyle="#252a31"; rr(-40,-28,65,56,8);
  ctx.fillStyle="#424a54"; rr(-18,-37,46,12,3); rr(-18,25,46,12,3);
  ctx.fillStyle="#5a6270"; rr(15,-20,40,40,6);
  ctx.fillStyle="#6a7280"; rr(38,-15,68-t.recoil,30,7);
  ctx.fillStyle="#1a1d22";
  for(let i=0;i<4;i++) ctx.fillRect(58+i*11-t.recoil,-16,4,32);
  ctx.fillStyle="#131518"; rr(100-t.recoil,-18,18,36,4);
  ctx.fillStyle="#000"; ctx.beginPath(); ctx.arc(109-t.recoil,0,7,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawLaserTower(t){
  ctx.fillStyle="rgba(0,150,220,0.04)";
  ctx.beginPath(); ctx.arc(t.x,t.y,46,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#123a52"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(t.x,t.y,36,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle="#0a1a28";
  ctx.beginPath(); ctx.arc(t.x,t.y,34,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#1a4060"; ctx.lineWidth=1;
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6;
    ctx.beginPath(); ctx.moveTo(t.x+Math.cos(a)*24,t.y+Math.sin(a)*24); ctx.lineTo(t.x+Math.cos(a)*34,t.y+Math.sin(a)*34); ctx.stroke();
  }
  ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.angle);
  ctx.fillStyle="#0c1e30"; rr(-30,-22,50,44,8);
  ctx.fillStyle="#102535"; rr(-14,-28,38,10,2); rr(-14,18,38,10,2);
  ctx.fillStyle="#133545"; rr(-4,-18,40,36,5);
  const heatR=Math.floor(t.heat*80), heatG=Math.floor(140+t.heat*50), heatB=Math.floor(220-t.heat*70);
  ctx.fillStyle=`rgb(${heatR},${heatG},${heatB})`; ctx.globalAlpha=0.25+t.heat*0.45;
  rr(-4,-18,40,36,5); ctx.globalAlpha=1;
  for(let i=0;i<4;i++){ ctx.fillStyle=i%2===0?"#162838":"#0e1e2e"; ctx.fillRect(6+i*7,-12,5,24); }
  ctx.save(); ctx.globalCompositeOperation="lighter";
  const cp=t.charge*(0.8+Math.sin(Date.now()*0.015)*0.2);
  ctx.strokeStyle=`rgba(0,180,255,${cp*0.6})`; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,17,-Math.PI*0.8,Math.PI*0.8); ctx.stroke();
  ctx.restore();
  ctx.fillStyle="#1e3e52"; rr(32,-6,46,12,3);
  ctx.fillStyle="#080e14"; ctx.beginPath(); ctx.arc(77,0,4,0,Math.PI*2); ctx.fill();
  if(t.firing){ ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.fillStyle="rgba(0,180,255,0.8)"; ctx.beginPath(); ctx.arc(77,0,7,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  ctx.restore();
  // charge bar
  const pw=80,ph=5; const px=t.x-pw/2,py=t.y+46;
  ctx.fillStyle="#081020"; ctx.beginPath(); ctx.roundRect(px,py,pw,ph,2); ctx.fill();
  ctx.save(); ctx.globalCompositeOperation="lighter";
  ctx.fillStyle="rgba(0,180,255,0.8)"; ctx.beginPath(); ctx.roundRect(px,py,pw*t.charge,ph,2); ctx.fill();
  ctx.restore();
}

function drawMortarTower(t){
  ctx.fillStyle="#121610";
  ctx.beginPath(); ctx.arc(t.x,t.y,38,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#2e3820"; ctx.lineWidth=5;
  ctx.beginPath(); ctx.arc(t.x,t.y,28,0,Math.PI*2); ctx.stroke();
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3;
    ctx.fillStyle="#384528";
    ctx.beginPath(); ctx.arc(t.x+Math.cos(a)*28,t.y+Math.sin(a)*28,4,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle="#1a2012";
  ctx.beginPath(); ctx.arc(t.x,t.y,24,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#2e3820"; ctx.fillRect(t.x-20,t.y-7,40,14);
  ctx.fillStyle="#222c14";
  ctx.beginPath(); ctx.arc(t.x,t.y,12,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.barrelAngle||t.angle);
  ctx.fillStyle="#242e14"; rr(-6-t.recoil*0.2,-6,22+t.recoil*0.2,12,3);
  ctx.fillStyle="#364520"; rr(14-t.recoil,-10,32,20,5);
  ctx.fillStyle="#141c0a"; ctx.beginPath(); ctx.arc(44-t.recoil,0,9,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#05070a"; ctx.beginPath(); ctx.arc(44-t.recoil,0,6,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#425530"; ctx.lineWidth=1.5;
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(22+i*7-t.recoil,0,4,0,Math.PI*2); ctx.stroke(); }
  ctx.restore();
  // update barrel angle for mortar
  if(enemies.length>0){
    const inRange=enemies.filter(e=>e.alive&&!e.cloaked&&dist2(e.x,e.y,t.x,t.y)<t.range**2);
    if(inRange.length>0){
      const tgt=inRange.reduce((a,b)=>b.wpIdx>a.wpIdx?b:a);
      const dx=tgt.x-t.x, dy=tgt.y-t.y, dist_=Math.sqrt(dx*dx+dy*dy);
      const T=0.6+dist_/(700*TSCALE);
      const vx=dx/T, vy=(dy-0.5*900*TSCALE*T*T)/T;
      const ba=Math.atan2(vy,vx);
      t.barrelAngle=(t.barrelAngle||t.angle)+(ba-(t.barrelAngle||t.angle))*0.1;
    }
  }
}


function drawTeslaTower(t){
  ctx.fillStyle="#101c26";
  ctx.beginPath(); ctx.arc(t.x,t.y,29,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#2b5a70"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(t.x,t.y,22,0,Math.PI*2); ctx.stroke();
  // three insulator posts
  for(let i=0;i<3;i++){
    const a=t.angle+i*Math.PI*2/3;
    const px=t.x+Math.cos(a)*17, py=t.y+Math.sin(a)*17;
    ctx.fillStyle="#3d6b80";
    ctx.beginPath(); ctx.arc(px,py,4.5,0,Math.PI*2); ctx.fill();
  }
  // coil stack
  ctx.fillStyle="#1b3242";
  ctx.beginPath(); ctx.arc(t.x,t.y,13,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#5fd8ec"; ctx.lineWidth=1.4;
  for(let i=0;i<4;i++){
    ctx.globalAlpha=0.35+i*0.15;
    ctx.beginPath(); ctx.arc(t.x,t.y,5+i*2.6,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // emitter orb, brighter as it comes off cooldown
  const heat=1-Math.min(1,t.fireTimer/(t.fireRate||1));
  ctx.save(); ctx.globalCompositeOperation="lighter";
  ctx.fillStyle=`rgba(125,249,255,${0.25+heat*0.6})`;
  ctx.beginPath(); ctx.arc(t.x,t.y,6+heat*4,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle="#d8fbff";
  ctx.beginPath(); ctx.arc(t.x,t.y,3.2,0,Math.PI*2); ctx.fill();
}

function drawCryoTower(t){
  ctx.fillStyle="#0e1a24";
  ctx.beginPath(); ctx.arc(t.x,t.y,33,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#27536b"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(t.x,t.y,26,0,Math.PI*2); ctx.stroke();
  // hex chiller housing
  ctx.fillStyle="#16303f";
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=t.angle*0.2+i*Math.PI/3;
    const px=t.x+Math.cos(a)*19, py=t.y+Math.sin(a)*19;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath(); ctx.fill();
  // frost vanes
  ctx.strokeStyle="#8fd4ee"; ctx.lineWidth=2; ctx.lineCap="round";
  const spin=Date.now()*0.0006;
  for(let i=0;i<6;i++){
    const a=spin+i*Math.PI/3;
    ctx.globalAlpha=0.55;
    ctx.beginPath();
    ctx.moveTo(t.x+Math.cos(a)*7,t.y+Math.sin(a)*7);
    ctx.lineTo(t.x+Math.cos(a)*17,t.y+Math.sin(a)*17);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.save(); ctx.globalCompositeOperation="lighter";
  const pulse=0.3+Math.sin(Date.now()*0.004)*0.15;
  ctx.fillStyle=`rgba(159,216,255,${pulse})`;
  ctx.beginPath(); ctx.arc(t.x,t.y,9,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.fillStyle="#e8fbff";
  ctx.beginPath(); ctx.arc(t.x,t.y,4,0,Math.PI*2); ctx.fill();
}

function drawSniperTower(t){
  ctx.fillStyle="#1d1a14";
  ctx.beginPath(); ctx.arc(t.x,t.y,29,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#4a4230"; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(t.x,t.y,22,0,Math.PI*2); ctx.stroke();
  ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.angle);
  // bipod legs
  ctx.strokeStyle="#5c5340"; ctx.lineWidth=3; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(30,-15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(30,15); ctx.stroke();
  // receiver
  ctx.fillStyle="#2a2519"; rr(-26,-12,44,24,5);
  ctx.fillStyle="#6b6046"; rr(-14,-16,26,7,2); rr(-14,9,26,7,2);
  // very long barrel
  ctx.fillStyle="#7d735a"; rr(14,-5,(78-t.recoil),10,3);
  ctx.fillStyle="#3a3426";
  for(let i=0;i<3;i++) ctx.fillRect(36+i*14-t.recoil,-6.5,3,13);
  // muzzle brake
  ctx.fillStyle="#151208"; rr(88-t.recoil,-7.5,12,15,2);
  ctx.fillStyle="#000"; ctx.beginPath(); ctx.arc(96-t.recoil,0,3.4,0,Math.PI*2); ctx.fill();
  // scope
  ctx.fillStyle="#12100a"; rr(-6,-20,26,9,3);
  ctx.fillStyle="#ffd27a"; ctx.globalAlpha=0.8;
  ctx.beginPath(); ctx.arc(17,-15.5,2.6,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
}

// ─── TURRET ATTACHMENTS ───────────────────────────────────────────────────────
// Hardware bolts on as a turret levels, so its progress reads at a glance.
const BRANCH_COLOR = {
  precision:"#7ec8ff", suppression:"#9ad9ff",
  siege:"#ffb057",     flak:"#ff8f4d",
  focus:"#67e8ff",     scatter:"#4fd0ff",
  cluster:"#b6d96a",   incendiary:"#ff7a3d"
};

function towerTier(t){
  const n=totalLevels(t);
  return n>=MAX_TOTAL?4 : n>=10?3 : n>=6?2 : n>=3?1 : 0;
}

function drawTowerRank(t){
  const tier=towerTier(t);
  if(tier===0) return;
  const base=TOWER_FOOTPRINT[t.type].base;
  const accent=t.branch?BRANCH_COLOR[t.branch]:"#8fa6bb";

  // Tier 1+: reinforced collar around the base
  ctx.strokeStyle=accent; ctx.globalAlpha=0.5; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(t.x,t.y,base*0.92,0,Math.PI*2); ctx.stroke();
  ctx.globalAlpha=1;

  // Tier 2+: ammo/coolant pods clamped to the sides
  if(tier>=2){
    for(let i=0;i<2;i++){
      const a=t.angle+Math.PI/2+i*Math.PI;
      const px=t.x+Math.cos(a)*base*0.78, py=t.y+Math.sin(a)*base*0.78;
      ctx.save(); ctx.translate(px,py); ctx.rotate(t.angle);
      ctx.fillStyle="#2c3542"; rr(-7,-4.5,14,9,3);
      ctx.fillStyle=accent; ctx.globalAlpha=0.75; rr(-4,-2,8,4,1.5); ctx.globalAlpha=1;
      ctx.restore();
    }
  }

  // Tier 3+: sensor mast with a blinking lamp
  if(tier>=3){
    const mx=t.x-Math.cos(t.angle)*base*0.62, my=t.y-Math.sin(t.angle)*base*0.62;
    ctx.strokeStyle="#556a80"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(mx,my-base*0.55); ctx.stroke();
    const blink=0.45+Math.sin(Date.now()*0.006)*0.35;
    ctx.fillStyle=accent; ctx.globalAlpha=blink;
    ctx.beginPath(); ctx.arc(mx,my-base*0.58,2.6,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    // armour skirt
    ctx.strokeStyle="#3d4a5a"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(t.x,t.y,base*1.06,t.angle+0.6,t.angle+Math.PI*2-0.6); ctx.stroke();
  }

  // Tier 4 (fully modernized): live core, halo and rank star
  if(tier>=4){
    ctx.save(); ctx.globalCompositeOperation="lighter";
    const pulse=0.30+Math.sin(Date.now()*0.004)*0.14;
    ctx.fillStyle=accent; ctx.globalAlpha=pulse*0.5;
    ctx.beginPath(); ctx.arc(t.x,t.y,base*0.55,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle=accent; ctx.lineWidth=1.5; ctx.globalAlpha=0.55;
    const spin=Date.now()*0.0012;
    for(let i=0;i<3;i++){
      const a0=spin+i*Math.PI*2/3;
      ctx.beginPath(); ctx.arc(t.x,t.y,base*1.20,a0,a0+0.9); ctx.stroke();
    }
    ctx.globalAlpha=1; ctx.restore();
    ctx.fillStyle=accent; ctx.font="bold 11px Courier New"; ctx.textAlign="center";
    ctx.fillText("★",t.x,t.y-base*1.42);
  }
}

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
function drawSidebar(){
  const x=playW;
  ctx.fillStyle="#08090e";
  ctx.fillRect(x,0,canvas.width-x,canvas.height);
  ctx.strokeStyle="rgba(255,255,255,0.06)";
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
}

// ─── MAIN LOOP ───────────────────────────────────────────────────────────────
function loop(now){
  const dt=Math.min(0.05,(now-lastTime)/1000);
  lastTime=now;

  if(gameState==="playing"){
    updateWave(dt);
    updateEnemies(dt);
    updateTowers(dt);
    updateProjectiles(dt);
    updateZones(dt);
    updateEffects(dt);
  }

  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(gameState==="playing"){
    drawSidebar();
    // clip to play area
    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,playW,canvas.height); ctx.clip();
    drawPath();
    drawGrid2();
    drawZones();
    drawEffects();
    drawProjectiles();
    drawArcsAndFrost();
    enemies.forEach(drawEnemy);
    drawTowers();
    // draw target reticle for mortar
    if(selectedTowerType==="mortar"&&hoveredCell){
      const [wx,wy]=gridToW(hoveredCell.gx,hoveredCell.gy);
      const t=(Math.sin(now*0.004)+1)*0.5;
      ctx.strokeStyle=`rgba(200,160,40,${0.3+t*0.3})`; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(wx,wy,16,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }

  requestAnimationFrame(loop);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildMapPreviews();
requestAnimationFrame(loop);
</script>
