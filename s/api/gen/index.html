<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gen</title>
<style>
html,body{margin:0;background:#070b12;color:#e8eef7}
body{padding:16px;font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:all;user-select:all}
</style>
</head>
<body><pre id="out"></pre>
<script src="../../codecs.js"></script>
<script>
(function () {
'use strict';

// GET /s/api/gen/#<url>  ->  the short link, as plain text and nothing else.
// ?emoji=1 allows the 256-symbol emoji alphabet.
//
// The url rides in the fragment, which never leaves the browser, so this is a
// browser/bookmarklet endpoint rather than something curl can drive — the site
// is static files with no server behind it.

var out = document.getElementById('out');
function say(text) { out.textContent = text; }

var target = '';
if (location.hash.length > 1) {
  target = location.hash.slice(1);
  // callers may or may not percent-encode; a stray '%' must not throw
  try { target = decodeURIComponent(target); } catch (e) {}
}

if (!target) {
  say('error: no url given\nusage: /s/api/gen/#https://example.com/some/long/path');
  return;
}

var emoji = new URLSearchParams(location.search).get('emoji') === '1';

window.SHORTLINK.encodeBest(target, emoji).then(function (best) {
  if (!best) { say('error: nothing encodable in that url'); return; }
  say(new URL('../../', location.href).href.split(/[?#]/)[0] + '#' + best.code);
}).catch(function (e) {
  say('error: ' + String(e && e.message || e));
});
})();
</script>
</body>
</html>
