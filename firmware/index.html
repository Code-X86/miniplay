<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firmware</title>
<meta name="description" content="Firmware built for my own hardware, by device.">
<style>
:root{
  color-scheme: dark;
  --bg:#050a13; --panel:#0a111e; --panel-2:#101827; --line:#283447;
  --text:#f4f7fb; --muted:#91a0b6; --dim:#74839a;
  --green:#a9ff32; --amber:#ffad0a; --blue:#5fb2ff;
  --body-glow:rgba(18,45,77,.22);
}
@media (prefers-color-scheme: light){
  :root{
    color-scheme: light;
    --bg:#eef2f8; --panel:#fff; --panel-2:#f5f8fd; --line:#d2dbea;
    --text:#0c1420; --muted:#55647a; --dim:#6b7a90;
    --green:#3f8a00; --amber:#a76400; --blue:#1d6fd0;
    --body-glow:rgba(120,170,255,.28);
  }
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:36px 22px 64px;color:var(--text);
  background:radial-gradient(1100px 620px at 50% -12%,var(--body-glow),transparent 70%),var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{width:min(880px,100%);margin:0 auto}
a{color:var(--blue)}
.back{display:inline-block;margin-bottom:18px;color:var(--muted);text-decoration:none;font-size:13.5px}
.back:hover{color:var(--text)}
h1{font-size:clamp(32px,6vw,52px);font-weight:900;letter-spacing:-.04em;line-height:1;margin:0 0 10px}
.lede{margin:0 0 34px;color:var(--muted);max-width:60ch}
.cat{margin-top:34px}
.cat > h2{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);margin:0 0 12px}
.device{border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background:linear-gradient(160deg,var(--panel-2),var(--panel));margin-bottom:16px}
.device > header{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.device h3{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.vendor{color:var(--muted);font-size:13px}
.specs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.specs span{border:1px solid var(--line);border-radius:999px;padding:3px 9px;
  font:11.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);background:var(--bg)}
.fw{display:grid;gap:1px;background:var(--line);margin:0;padding:0}
.fw > li{list-style:none;background:var(--panel);padding:16px 22px}
.fw h4{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.badge{border-radius:999px;padding:2px 8px;font:10.5px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted)}
.badge.active{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.badge.archived{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,var(--line))}
.fw p{margin:7px 0 0;color:var(--muted);font-size:14px}
.meta{margin:12px 0 0;padding:0;display:grid;gap:5px}
.meta div{display:flex;gap:10px;font-size:12.5px}
.meta dt{flex:0 0 82px;color:var(--dim);
  font:11.5px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;text-transform:uppercase;letter-spacing:.06em}
.meta dd{margin:0;color:var(--muted)}
.meta code{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;
  background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.links{margin-top:13px;display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-block;padding:6px 13px;border:1px solid var(--line);border-radius:999px;
  background:var(--bg);color:inherit;text-decoration:none;font-size:13px}
.links a:hover{border-color:var(--blue);color:var(--blue)}
.empty{color:var(--dim);font-size:13.5px;padding:16px 22px;background:var(--panel)}
.rel{margin-top:13px}
.rel button{border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--muted);
  padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
.rel button:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.rel button:disabled{opacity:.6;cursor:default}
.rel .out{margin-top:11px;font-size:13px;color:var(--muted)}
.rel .tag{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:9px}
.rel .tag b{color:var(--text);font-size:14px}
.rel .when{color:var(--dim);font:11.5px ui-monospace,SFMono-Regular,Consolas,monospace}
.rel ul{margin:6px 0 0;padding:0;display:grid;gap:4px}
.rel li{list-style:none;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.rel .size{color:var(--dim);font:11.5px ui-monospace,SFMono-Regular,Consolas,monospace}
footer{margin-top:40px;color:var(--dim);font-size:13px}
@media(max-width:520px){.meta dt{flex-basis:100%}.meta div{flex-wrap:wrap;gap:2px}}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="../">&larr; austin-code.com</a>
  <h1>Firmware</h1>
  <p class="lede">Firmware I build for my own hardware. Grouped by device — each board keeps its own list, so a device with several builds shows all of them.</p>
  <div id="catalogue"></div>
  <footer id="foot"></footer>
</main>

<script>
(function () {
'use strict';

// Adding a board or a build is an edit to this one structure: a category holds
// devices, and every device holds its own firmware list.
var CATEGORIES = [
  {
    name: 'Smartwatches',
    devices: [
      {
        name: 'ESP32-S3-Touch-AMOLED-2.06',
        vendor: 'Waveshare',
        specs: ['ESP32-S3', '16 MB flash', '8 MB PSRAM', 'CO5300 QSPI AMOLED 410×502',
                'FT3168 touch', 'AXP2101 PMU', 'PCF85063 RTC', 'ES8311 codec', 'QMI8658 IMU'],
        firmware: [
          {
            name: 'WatchOS',
            status: 'active',
            summary: 'A smartwatch OS written from scratch — no LVGL. Hand-written RGB565 compositor with a 5×7 bitmap font engine and 10 built-in font styles, Ring / Minimal / Analog watch faces, and apps for music, gallery, calculator, files, settings and a flashlight. Auto-dim and sleep, wake on touch or button, charging animation, battery reserve and critical modes.',
            target: 'Arduino sketch, ESP32 Arduino core 3.3.x (ESP-IDF 5.x)',
            toolchain: 'arduino-cli 1.x · Arduino_GFX, XPowersLib, SensorLib, NimBLE-Arduino 2.x',
            companion: 'Android 8.0+ BLE app — call forwarding with accept/decline, two-way settings sync, live screen indicator, font and file upload',
            install: 'Built from source; no prebuilt image published yet',
            repo: 'Code-X86/WatchOS',
            links: [
              ['Source', 'https://github.com/Code-X86/WatchOS'],
              ['Firmware directory', 'https://github.com/Code-X86/WatchOS/tree/main/watch-os-arduino'],
              ['Android companion', 'https://github.com/Code-X86/WatchOS/tree/main/watch-os-arduino/android-companion']
            ]
          },
          {
            name: 'watch-os (ESP-IDF)',
            status: 'archived',
            summary: 'The original ESP-IDF architecture of the OS — driver interfaces, host-tested modules and design docs. Superseded by the Arduino build above, kept for the design work.',
            target: 'ESP-IDF',
            install: 'Source only',
            links: [['Source', 'https://github.com/Code-X86/WatchOS/tree/main/watch-os']]
          }
        ]
      }
    ]
  }
];

var LABELS = {
  target: 'Target', toolchain: 'Toolchain', companion: 'Companion', install: 'Install'
};

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function firmwareRow(f) {
  var meta = '';
  ['target', 'toolchain', 'companion', 'install'].forEach(function (k) {
    if (!f[k]) return;
    meta += '<div><dt>' + LABELS[k] + '</dt><dd>' + esc(f[k]) + '</dd></div>';
  });
  var links = (f.links || []).map(function (l) {
    return '<a href="' + esc(l[1]) + '" rel="noopener">' + esc(l[0]) + '</a>';
  }).join('');
  // Deliberately a button, not a fetch on load: visiting this page makes no
  // outside requests, which is the promise the rest of the site keeps. Asking
  // for releases is a thing you choose to do.
  var rel = f.repo
    ? '<div class="rel" data-repo="' + esc(f.repo) + '">' +
        '<button type="button">Check for releases</button>' +
        '<div class="out"></div>' +
      '</div>'
    : '';
  return '<li>' +
    '<h4>' + esc(f.name) +
      (f.status ? '<span class="badge ' + esc(f.status) + '">' + esc(f.status) + '</span>' : '') +
    '</h4>' +
    (f.summary ? '<p>' + esc(f.summary) + '</p>' : '') +
    (meta ? '<dl class="meta">' + meta + '</dl>' : '') +
    (links ? '<div class="links">' + links + '</div>' : '') +
    rel +
  '</li>';
}

function deviceCard(d) {
  var specs = (d.specs || []).map(function (s) { return '<span>' + esc(s) + '</span>'; }).join('');
  var list = (d.firmware || []).length
    ? '<ul class="fw">' + d.firmware.map(firmwareRow).join('') + '</ul>'
    : '<p class="empty">No firmware listed for this device yet.</p>';
  return '<article class="device">' +
    '<header>' +
      '<h3>' + esc(d.name) + '</h3>' +
      (d.vendor ? '<div class="vendor">' + esc(d.vendor) + '</div>' : '') +
      (specs ? '<div class="specs">' + specs + '</div>' : '') +
    '</header>' + list +
  '</article>';
}

document.getElementById('catalogue').innerHTML = CATEGORIES.map(function (c) {
  return '<section class="cat"><h2>' + esc(c.name) + '</h2>' +
    (c.devices || []).map(deviceCard).join('') + '</section>';
}).join('');

function bytes(n) {
  if (!n && n !== 0) return '';
  var u = ['B', 'KB', 'MB', 'GB'], i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(1)) + ' ' + u[i];
}

Array.prototype.forEach.call(document.querySelectorAll('.rel'), function (box) {
  var repo = box.getAttribute('data-repo');
  var btn = box.querySelector('button'), out = box.querySelector('.out');
  btn.onclick = function () {
    btn.disabled = true;
    out.textContent = 'Asking GitHub\u2026';
    fetch('https://api.github.com/repos/' + repo + '/releases')
      .then(function (r) {
        if (r.status === 403 || r.status === 429) throw new Error('GitHub is rate limiting this address — try again later.');
        if (!r.ok) throw new Error('GitHub returned ' + r.status + '.');
        return r.json();
      })
      .then(function (list) {
        btn.disabled = false;
        if (!list.length) {
          out.innerHTML = 'No releases published on <code>' + esc(repo) + '</code> yet — build from source for now.';
          return;
        }
        out.innerHTML = list.slice(0, 5).map(function (r) {
          var assets = (r.assets || []).map(function (a) {
            return '<li><a href="' + esc(a.browser_download_url) + '" rel="noopener">' + esc(a.name) + '</a>' +
                   '<span class="size">' + bytes(a.size) + '</span></li>';
          }).join('');
          return '<div class="tag">' +
              '<b>' + esc(r.tag_name) + '</b>' +
              (r.name && r.name !== r.tag_name ? '<span>' + esc(r.name) + '</span>' : '') +
              '<span class="when">' + esc((r.published_at || '').slice(0, 10)) + '</span>' +
            '</div>' +
            (assets ? '<ul>' + assets + '</ul>'
                    : '<div class="when" style="margin-top:4px">no attached files</div>');
        }).join('');
      })
      .catch(function (e) {
        btn.disabled = false;
        out.textContent = String(e && e.message || e);
      });
  };
});

var devices = 0, builds = 0;
CATEGORIES.forEach(function (c) {
  (c.devices || []).forEach(function (d) { devices++; builds += (d.firmware || []).length; });
});
document.getElementById('foot').textContent =
  builds + ' build' + (builds === 1 ? '' : 's') + ' across ' +
  devices + ' device' + (devices === 1 ? '' : 's') + ' in ' +
  CATEGORIES.length + ' categor' + (CATEGORIES.length === 1 ? 'y' : 'ies') + '.';
})();
</script>
</body>
</html>
